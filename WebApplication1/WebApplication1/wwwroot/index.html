<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Счётчик шагов</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #050506;
            color: #f5f5f7;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at 50% 15%, rgba(71, 71, 82, .35), transparent 36%),
                #050506;
        }

        .watch {
            width: min(100%, 390px);
            padding: 12px;
            border: 1px solid #2c2c32;
            border-radius: 48px;
            background: linear-gradient(145deg, #29292e, #0d0d0f 45%, #232328);
            box-shadow: 0 30px 70px rgba(0, 0, 0, .65), inset 0 1px 1px rgba(255, 255, 255, .18);
        }

        .screen {
            min-height: 650px;
            padding: 30px 24px 24px;
            border-radius: 38px;
            overflow: hidden;
            text-align: center;
            background: radial-gradient(circle at 50% 45%, #18181c, #050506 72%);
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            color: #8e8e98;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: .04em;
        }

        h1 {
            margin: 34px 0 4px;
            font-size: 20px;
            font-weight: 600;
        }

        .subtitle { margin: 0; color: #8e8e98; font-size: 13px; }

        .activity-ring {
            width: 230px;
            height: 230px;
            margin: 28px auto 24px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: conic-gradient(#ff375f 0 25%, #ff9f0a 25% 48%, #30d158 48% 78%, #27272d 78% 100%);
            box-shadow: 0 0 26px rgba(48, 209, 88, .18), inset 0 0 12px rgba(0, 0, 0, .8);
            transform: rotate(-30deg);
        }

        .ring-inner {
            width: 184px;
            height: 184px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: #08080a;
            transform: rotate(30deg);
        }

        .steps { color: #30d158; font-size: 42px; font-weight: 700; letter-spacing: -1px; }
        .steps-label { margin-top: 2px; color: #8e8e98; font-size: 12px; }

        .date { color: #d1d1d6; font-size: 14px; }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 28px;
        }

        .stat {
            padding: 16px 8px;
            border: 1px solid #2b2b31;
            border-radius: 18px;
            background: rgba(255, 255, 255, .055);
        }

        .stat-value { display: block; color: #f5f5f7; font-size: 18px; font-weight: 600; }
        .stat-label { display: block; margin-top: 4px; color: #8e8e98; font-size: 11px; }

        .status { margin-top: 26px; color: #8e8e98; font-size: 12px; }
        .status::before { content: "●"; margin-right: 6px; color: #30d158; }

        @media (max-width: 430px) {
            body { padding: 10px; }
            .screen { min-height: 620px; }
        }
    </style>
</head>
<body>
    <main class="watch">
        <section class="screen">
            <div class="topbar"><span>Shagomer</span><span id="time">--:--</span></div>
            <h1>Активность</h1>
            <p id="date" class="subtitle">Загрузка...</p>
            <div class="activity-ring">
                <div class="ring-inner">
                    <div>
                        <div id="steps" class="steps">—</div>
                        <div class="steps-label">ШАГОВ</div>
                    </div>
                </div>
            </div>
            <div class="stats">
                <div class="stat"><span id="distance" class="stat-value">—</span><span class="stat-label">КИЛОМЕТРОВ</span></div>
                <div class="stat"><span id="calories" class="stat-value">—</span><span class="stat-label">КАЛОРИЙ</span></div>
            </div>
            <div class="status">Цель на сегодня: <span id="goal">—</span></div>
        </section>
    </main>

    <script>
        async function loadSteps() {
            const stepsElement = document.getElementById('steps');
            const dateElement = document.getElementById('date');
            stepsElement.textContent = '...';

            try {
                const response = await fetch('/api/steps');
                if (!response.ok) throw new Error('Ошибка сервера');

                const data = await response.json();
                stepsElement.textContent = Number(data.steps).toLocaleString('ru-RU');
                dateElement.textContent = data.date;
                document.getElementById('distance').textContent = `${Number(data.distanceKm).toLocaleString('ru-RU')} км`;
                document.getElementById('calories').textContent = `${Number(data.calories).toLocaleString('ru-RU')} ккал`;
                document.getElementById('goal').textContent = `${Number(data.goal).toLocaleString('ru-RU')} шагов`;
            } catch (error) {
                stepsElement.textContent = 'Ошибка';
                dateElement.textContent = 'Не удалось загрузить количество шагов';
            }
        }

        loadSteps();

        const firstDisplayedMinutes = 18 * 60 + 1;
        const latestDisplayedMinutes = 23 * 60 + 55;
        let displayedMinutes = firstDisplayedMinutes + Math.floor(
            Math.random() * (latestDisplayedMinutes - firstDisplayedMinutes + 1));

        function updateWatchTime() {
            const hoursText = String(Math.floor(displayedMinutes / 60)).padStart(2, '0');
            const minutesText = String(displayedMinutes % 60).padStart(2, '0');
            document.getElementById('time').textContent = `${hoursText}:${minutesText}`;

            if (displayedMinutes < latestDisplayedMinutes) {
                displayedMinutes++;
            }
        }

        updateWatchTime();
        setInterval(updateWatchTime, 60 * 1000);
    </script>
</body>
</html>
